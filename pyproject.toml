[project]
name = "blurry-opsec"
version = "0.1.0"
description = "Cover faces and strip metadata from photos and videos, locally and offline."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chrono-Web contributors" }]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Security",
]
dependencies = [
    # Headless on purpose: the regular wheel ships its own Qt, which clashes with PySide6.
    "opencv-python-headless>=4.8,<5",
    "numpy>=1.26",
    "pillow>=10.4",
    "pi-heif>=0.18",
    "av>=18.1",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.7"]

[project.scripts]
blurry = "blurry_opsec.__main__:main"

[project.urls]
Homepage = "https://github.com/Chrono-Web/BLURRY"
Releases = "https://github.com/Chrono-Web/BLURRY/releases"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/blurry_opsec", "LICENSE", "THIRD_PARTY_LICENSES.md", "licenses", "README.md",
           "README.it.md", "THREAT_MODEL.md", "THREAT_MODEL.it.md", "CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/blurry_opsec"]

[tool.uv]
required-version = ">=0.5"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
