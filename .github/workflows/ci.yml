name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop-packages:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/desktop.yml

  python-wheel:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        extra: [base, gui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.22"
          enable-cache: false
      - run: uv build --no-sources
      - run: uv venv --python 3.12 build/wheel-test
      - name: Install wheel and selected extra
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          WHEEL=$(find dist -name '*.whl')
          if [ "$EXTRA" = gui ]; then WHEEL="$WHEEL[gui]"; fi
          uv pip install --python build/wheel-test "$WHEEL" pytest
      - name: Base wheel does not install Qt
        if: matrix.extra == 'base'
        run: build/wheel-test/bin/python -c "import importlib.util; assert importlib.util.find_spec('PySide6') is None"
      - run: build/wheel-test/bin/python -m pytest tests/test_cli_contract.py -q
        env:
          QT_QPA_PLATFORM: deliberately-invalid

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: false
      - run: uv sync --frozen --all-extras
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      BLURRY_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: false
      - name: Test tools (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          ffmpeg libimage-exiftool-perl libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Test tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg exiftool
      - name: Test tools (Windows)
        if: runner.os == 'Windows'
        run: choco install -y --no-progress ffmpeg exiftool
      - run: uv sync --frozen --all-extras
      - run: uv run --frozen pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  offline:
    name: test (Linux, --network none)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f .github/ci/offline.Dockerfile -t blurry-offline .
      - run: docker run --rm --network none blurry-offline

  macos-app:
    name: app macOS (swift build)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift build --package-path macos -c release --arch arm64
      - run: swift test --package-path macos

  ios-kit:
    name: BlurryKit (iOS engine, parity with Python)
    runs-on: macos-14
    env:
      BLURRY_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: false
      - run: brew install exiftool
      - run: uv sync --frozen
      - run: scripts/coreml/test-kit.sh
